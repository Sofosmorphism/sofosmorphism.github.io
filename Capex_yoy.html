<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Big Tech CapEx Plan (2018-2026)</title>
    
    <script src="https://code.highcharts.com/highcharts.js"></script>
    <script src="https://code.highcharts.com/modules/exporting.js"></script>
    <script src="https://code.highcharts.com/modules/export-data.js"></script>
    <script src="https://code.highcharts.com/modules/accessibility.js"></script>

    <style>
        body { 
            margin: 0; 
            padding: 20px; 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            background-color: transparent; 
        }
        #chart-container {
            width: 100%;
            height: 600px;
            background: #ffffff; 
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            padding: 10px;
            box-sizing: border-box;
        }

        /* Tự động chuyển nền container sang màu tối khi thiết bị bật Dark Mode */
        @media (prefers-color-scheme: dark) {
            #chart-container {
                background: #1e1e1e;
                box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            }
        }
    </style>
</head>
<body>

    <div id="chart-container"></div>

    <script>
        // Tự động nhận diện chế độ sáng/tối
        var isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;

        // Định nghĩa các chuỗi màu sắc thích ứng
        var titleColor = isDark ? '#4ade80' : '#00441b';
        var subtitleColor = isDark ? '#86efac' : '#238b45';
        var axisTitleColor = isDark ? '#86efac' : '#1e5128';
        var labelColor = isDark ? '#e5e7eb' : '#333333';
        var gridLineColor = isDark ? '#374151' : '#e5f5e0';
        var crosshairColor = isDark ? 'rgba(255, 255, 255, 0.1)' : 'rgba(0, 0, 0, 0.05)';
        
        var tooltipBg = isDark ? 'rgba(30, 30, 30, 0.95)' : 'rgba(255, 255, 255, 0.95)';
        var tooltipBorder = isDark ? '#4ade80' : '#41ab5d';
        var tooltipTextColor = isDark ? '#f3f4f6' : '#333333';
        var hrColor = isDark ? '#555555' : '#333333';

        Highcharts.chart('chart-container', {
            chart: {
                type: 'spline', 
                backgroundColor: 'transparent'
            },
            title: {
                text: 'Big Tech Capital Expenditure (CapEx)',
                style: { color: titleColor, fontWeight: 'bold' } 
            },
            subtitle: {
                text: '2018 - 2026 (Estimated in Billions USD)',
                style: { color: subtitleColor }
            },
            xAxis: {  
                categories: ['2018', '2019', '2020', '2021', '2022', '2023', '2024', '2025', '2026'],  
                labels: {
                    style: { color: labelColor } 
                },
                crosshair: {  
                    color: crosshairColor, 
                    dashStyle: 'solid'  
                }  
            },
            yAxis: {
                title: {
                    text: 'Capital Expenditure (Billion USD)',
                    style: { color: axisTitleColor }
                },
                labels: {
                    format: '${value}B', 
                    style: { color: labelColor } 
                },
                gridLineColor: gridLineColor 
            },
            legend: {
                itemStyle: { color: labelColor }, 
                itemHoverStyle: { color: titleColor }
            },
            tooltip: {
                shared: true, 
                useHTML: true,
                backgroundColor: tooltipBg, 
                borderColor: tooltipBorder,
                borderRadius: 8,
                shadow: true,
                
                // --- VŨ KHÍ CHỐNG CẮT CHỮ NẰM Ở ĐÂY ---
                // Mở thẻ <div style="white-space: nowrap;"> ở Header và đóng </div> ở Footer
                headerFormat: '<div style="white-space: nowrap;"><span style="font-size: 14px; font-weight: bold; color: ' + tooltipTextColor + ';">Year {point.key}</span><br/><hr style="border: 0; border-top: 1px solid ' + hrColor + '; margin: 5px 0;">',
                pointFormat: '<span style="color: ' + tooltipTextColor + ';"><span style="color:{series.color}">\u25CF</span> {series.name}: <b>${point.y}B</b></span><br/>',
                footerFormat: '</div>'
                // -------------------------------------
            },
            plotOptions: {
                spline: {
                    lineWidth: 3,
                    marker: {
                        radius: 4,
                        symbol: 'circle'
                    }
                }
            },
            series: [
                {
                    name: 'Amazon',
                    data: [13, 17, 40, 61, 64, 53, 83, 132, 200],
                    color: '#FFAA4A' 
                },
                {
                    name: 'Google',
                    data: [25, 24, 22, 25, 31, 32, 53, 91, 190],
                    color: '#41ab5d' 
                },
                {
                    name: 'Microsoft',
                    data: [14, 14, 18, 23, 25, 35, 56, 83, 190],
                    color: '#820DFF' 
                },
                {
                    name: 'Meta',
                    data: [14, 15, 15, 19, 31, 27, 37, 70, 135],
                    color: '#3589EA' 
                }
            ]
        });
    </script>
</body>
</html>
