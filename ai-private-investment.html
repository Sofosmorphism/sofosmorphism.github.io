<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>External funding for privately held AI companies </title>
    
    <script src="https://code.highcharts.com/highcharts.js"></script>
    <script src="https://code.highcharts.com/modules/exporting.js"></script>
    <script src="https://code.highcharts.com/modules/export-data.js"></script>
    <script src="https://code.highcharts.com/modules/accessibility.js"></script>

    <style>
        body { margin: 0; padding: 20px; font-family: 'Segoe UI', Tahoma, sans-serif; background-color: transparent; }
        #chart-container {
            width: 100%;
            height: 600px;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            padding: 10px;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <div id="chart-container"></div>

    <script>
        Highcharts.chart('chart-container', {
            chart: {
                type: 'spline', 
                backgroundColor: 'transparent'
            },
            title: {
                text: 'External funding for privately held AI companies (2013 - 2025)',
                style: { color: '#2c3e50', fontWeight: 'bold' }
            },
            subtitle: {
                text: 'Đơn vị: Billion USD'
            },
            xAxis: {
                categories: ['2013', '2014', '2015', '2016', '2017', '2018', '2019', '2020', '2021', '2022', '2023', '2024', '2025'],
                crosshair: true // Tạo đường dóng dọc khi trỏ chuột
            },
            yAxis: {
                title: {
                    text: 'Vốn đầu tư (Billion USD)'
                },
                labels: {
                    format: '{value} Billion'
                }
            },
            tooltip: {
                shared: true, // Hiển thị data của tất cả các đường tại cùng 1 năm khi hover
                useHTML: true,
                headerFormat: '<span style="font-size: 14px; font-weight: bold; color: #333;">Năm {point.key}</span><br/>',
                pointFormat: '<span style="color:{series.color}">\u25CF</span> {series.name}: <b>{point.y} Billion USD</b><br/>',
                backgroundColor: 'rgba(255, 255, 255, 0.95)',
                borderRadius: 8,
                shadow: true
            },
            plotOptions: {
                spline: {
                    lineWidth: 3,
                    marker: {
                        radius: 4,
                        symbol: 'circle'
                    }
                }
            },
            // Dữ liệu đã được quy đổi sang Tỷ USD (Làm tròn 2 chữ số thập phân)
            series: [
                {
                    name: 'World',
                    data: [6.01, 10.94, 15.26, 19.34, 28.43, 46.51, 61.66, 77.25, 145.40, 104.64, 92.79, 130.85, 290.09],
                    color: '#2c3e50', // Dark Grey
                    dashStyle: 'Dash', // Dash Line
                    lineWidth: 4            
                },
                {
                    name: 'United States',
                    data: [4.21, 7.96, 10.63, 11.46, 15.55, 22.72, 33.99, 46.29, 86.86, 56.65, 64.35, 94.63, 240.61],
                    color: '#00558f' // Blue
                },
                {
                    name: 'Europe',
                    data: [0.76, 1.49, 0.98, 1.39, 2.86, 3.24, 6.71, 6.49, 14.65, 13.69, 10.80, 16.87, 17.61],
                    color: '#27ae60' // Green
                },
                {
                    name: 'China',
                    data: [0.72, 0.77, 2.39, 5.10, 7.31, 15.07, 14.90, 17.87, 25.89, 13.95, 8.42, 8.11, 10.45],
                    color: '#e74c3c' // Red
                }
            ]
        });
    </script>
</body>
</html>
