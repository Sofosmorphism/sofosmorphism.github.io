<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Funding Map</title>
    <script src="https://code.highcharts.com/maps/highmaps.js"></script>
    <script src="https://code.highcharts.com/maps/modules/data.js"></script>
    <script src="https://code.highcharts.com/mapdata/custom/world.js"></script>
    <style>
        body { margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; background: transparent; }
        .ai-map-wrapper { display: flex; flex-direction: row; width: 100%; height: 100vh; gap: 15px; box-sizing: border-box; }
        #map-container { flex: 2; height: 100%; }
        .table-container { flex: 1; height: 100%; overflow-y: auto; border-left: 1px solid #eee; }
        table { width: 100%; border-collapse: collapse; margin: 0; }
        
        /* Updated Table Colors to match Green Theme */
        th { background: #1e5128; color: white; position: sticky; top: 0; padding: 10px; text-align: left; font-size: 13px; z-index: 2; }
        td { padding: 8px 10px; border-bottom: 1px solid #eee; font-size: 12px; color: #333; cursor: pointer; transition: background-color 0.2s; }
        tr:hover td { background-color: #d8f3dc; color: #1e5128; font-weight: bold; }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #ccc; border-radius: 4px; }
        @media (max-width: 768px) {
            .ai-map-wrapper { flex-direction: column; height: auto; }
            #map-container { height: 350px; }
            .table-container { border-left: none; height: 300px; }
        }
    </style>
</head>
<body>
    <div class="ai-map-wrapper">
        <div id="map-container"></div>
        <div class="table-container">
            <table>
                <thead>
                    <tr><th>Rank</th><th>Country</th><th>Total Investment (in USD, Billions)</th></tr>
                </thead>
                <tbody id="ranking-table-body"></tbody>
            </table>
        </div>
    </div>
    <script>
        const rawData = [
            { name: "United States", value: 757.3, rank: 1, key: "us" }, { name: "China", value: 131.8, rank: 2, key: "cn" },
            { name: "United Kingdom", value: 34.1, rank: 3, key: "gb" }, { name: "Canada", value: 19.6, rank: 4, key: "ca" },
            { name: "Israel", value: 18.5, rank: 5, key: "il" }, { name: "Germany", value: 17.2, rank: 6, key: "de" },
            { name: "France", value: 15.6, rank: 7, key: "fr" }, { name: "India", value: 15.4, rank: 8, key: "in" },
            { name: "South Korea", value: 10.8, rank: 9, key: "kr" }, { name: "Singapore", value: 9.1, rank: 10, key: "sg" },
            { name: "Sweden", value: 8.2, rank: 11, key: "se" }, { name: "Japan", value: 7, rank: 12, key: "jp" },
            { name: "Australia", value: 6.5, rank: 13, key: "AU" }, { name: "Switzerland", value: 4.7, rank: 14, key: "CH" },
            { name: "United Arab Emirates", value: 4.2, rank: 15, key: "ae" }
        ];

        const chart = Highcharts.mapChart('map-container', {
            chart: { map: 'custom/world', backgroundColor: 'transparent' },
            title: { text: null }, credits: { enabled: false },
            mapNavigation: { enabled: true, buttonOptions: { verticalAlign: 'bottom' } },
            
            // Updated Color Scheme to Shades of Green
            colorAxis: { 
                min: 1, max: 500, type: 'logarithmic', 
                minColor: '#e5f5e0', maxColor: '#00441b', 
                stops: [[0, '#e5f5e0'], [0.5, '#41ab5d'], [1, '#00441b']] 
            },
            
            legend: { title: { text: 'Total Investment (in USD, Billions)', style: { fontStyle: 'italic', fontSize: '11px' } } },
            tooltip: {
                backgroundColor: 'rgba(255, 255, 255, 0.95)', borderWidth: 1, borderRadius: 5, shadow: true, useHTML: true, headerFormat: '',
                pointFormat: `<div style="padding: 5px;"><b style="font-size: 14px; color: #1e5128;">{point.name}</b><br/><span style="color: #7f8c8d;">Hạng:</span> <b>#{point.rank}</b><br/><span style="color: #7f8c8d;">Vốn:</span> <b style="color: #e74c3c;">{point.value} Tỷ USD</b></div>`
            },
            series: [{
                data: rawData, joinBy: ['hc-key', 'key'], name: 'Đầu tư AI',
                allowPointSelect: true,
                states: { 
                    hover: { color: '#f1c40f', borderColor: '#333', borderWidth: 1.5 }, // Yellow highlight on map hover
                    select: { color: '#f1c40f', borderColor: '#1e5128', borderWidth: 2 } 
                },
                dataLabels: { enabled: false }
            }]
        });

        const tableBody = document.getElementById('ranking-table-body');
        rawData.forEach((country) => {
            const row = document.createElement('tr');
            row.innerHTML = `<td>${country.rank}</td><td><b>${country.name}</b></td><td>${country.value.toFixed(1)}</td>`;
            
            // Fixed the hover interaction
            row.addEventListener('mouseenter', () => { 
                const point = chart.series[0].points.find(p => p.key === country.key); 
                if (point) { 
                    point.setState('hover'); // Now triggers the hover glow correctly
                    chart.tooltip.refresh(point); 
                } 
            });
            row.addEventListener('mouseleave', () => { 
                const point = chart.series[0].points.find(p => p.key === country.key); 
                if (point) { 
                    point.setState(''); 
                    chart.tooltip.hide(); 
                } 
            });
            tableBody.appendChild(row);
        });
    </script>
</body>
</html>
