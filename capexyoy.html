<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Big Tech CapEx Plan (2018-2026)</title>
    
    <script src="https://code.highcharts.com/highcharts.js"></script>
    <script src="https://code.highcharts.com/modules/exporting.js"></script>
    <script src="https://code.highcharts.com/modules/export-data.js"></script>
    <script src="https://code.highcharts.com/modules/accessibility.js"></script>

    <style>
        body { 
            margin: 0; 
            padding: 20px; 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            background-color: transparent; 
        }
        #chart-container {
            width: 100%;
            height: 600px;
            background: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            padding: 10px;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <div id="chart-container"></div>

    <script>
        Highcharts.chart('chart-container', {
            chart: {
                type: 'spline', // Creates smooth, curved lines
                backgroundColor: 'transparent'
            },
            title: {
                text: 'Big Tech Capital Expenditure (CapEx)',
                style: { color: '#00441b', fontWeight: 'bold' } // Dark green text
            },
            subtitle: {
                text: '2018 - 2026 (Estimated in Billions USD)',
                style: { color: '#238b45' }
            },
            xAxis: {
                categories: ['2018', '2019', '2020', '2021', '2022', '2023', '2024', '2025', '2026'],
                crosshair: {
                    color: '#a1d99b',
                    dashStyle: 'solid'
                }
            },
            yAxis: {
                title: {
                    text: 'Capital Expenditure (Billion USD)',
                    style: { color: '#1e5128' }
                },
                labels: {
                    format: '${value}B', // Adds $ and B to the Y-axis labels
                    style: { color: '#333' }
                },
                gridLineColor: '#e5f5e0' // Light green grid lines
            },
            tooltip: {
                shared: true, // Groups all lines' data into one hover box
                useHTML: true,
                headerFormat: '<span style="font-size: 14px; font-weight: bold; color: #DDDDDD;">Year {point.key}</span><br/><hr style="border: 0; border-top: 1px solid #333; margin: 5px 0;">',
                pointFormat: '<span style="color:{series.color}">\u25CF</span> {series.name}: <b>${point.y}B</b><br/>',
                backgroundColor: 'rgba(255, 255, 255, 0.95)', // 
                borderColor: '#41ab5d',
                borderRadius: 8,
                shadow: true
            },
            plotOptions: {
                spline: {
                    lineWidth: 3,
                    marker: {
                        radius: 4,
                        symbol: 'circle'
                    }
                }
            },
            // Green Theme Color Palette for Series
            series: [
                {
                    name: 'Amazon',
                    data: [13, 17, 40, 61, 64, 53, 83, 132, 200],
                    color: '#FFAA4A' // Yellow-orange
                },
                {
                    name: 'Google',
                    data: [25, 24, 22, 25, 31, 32, 53, 91, 190],
                    color: '#41ab5d' // Medium dark green
                },
                {
                    name: 'Microsoft',
                    data: [14, 14, 18, 23, 25, 35, 56, 83, 190],
                    color: '#820DFF' // purple
                },
                {
                    name: 'Meta',
                    data: [14, 15, 15, 19, 31, 27, 37, 70, 135],
                    color: '#3589EA' // Blue
                }
            ]
        });
    </script>
</body>
</html>
