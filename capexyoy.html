<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Big Tech CapEx Plan (2018-2026)</title>
    
    <script src="https://code.highcharts.com/highcharts.js"></script>
    <script src="https://code.highcharts.com/modules/exporting.js"></script>
    <script src="https://code.highcharts.com/modules/export-data.js"></script>
    <script src="https://code.highcharts.com/modules/accessibility.js"></script>

    <style>
        /* 1. Khai báo biến màu sắc cho Chế độ Sáng (Mặc định) */
        :root {
            --bg-container: #ffffff;
            --text-title: #00441b;
            --text-subtitle: #238b45;
            --text-axis: #333333;
            --grid-line: #e5f5e0;
            --crosshair: rgba(0, 0, 0, 0.05);
            --tooltip-bg: rgba(255, 255, 255, 0.95);
            --tooltip-text: #333333; 
            --tooltip-border: #41ab5d;
            --hr-line: #cccccc;
        }

        /* 2. Khai báo biến màu sắc cho Chế độ Tối (Dark Mode) */
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-container: #1e1e1e; /* Nền xám đen sang trọng */
                --text-title: #4ade80;   /* Xanh lá sáng để nổi bật trên nền đen */
                --text-subtitle: #86efac;
                --text-axis: #e5e7eb;    /* Trắng xám cho các nhãn trục */
                --grid-line: #374151;    /* Đường lưới xám tối */
                --crosshair: rgba(255, 255, 255, 0.1);
                --tooltip-bg: rgba(30, 30, 30, 0.95);
                --tooltip-text: #f3f4f6;
                --tooltip-border: #4ade80;
                --hr-line: #555555;
            }
            body {
                background-color: #121212 !important; /* Làm tối luôn nền trang web ngoài chart */
            }
        }

        body { 
            margin: 0; 
            padding: 20px; 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            background-color: transparent; 
        }

        #chart-container {
            width: 100%;
            height: 600px;
            background: var(--bg-container); /* Gọi biến CSS nền */
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            padding: 10px;
            box-sizing: border-box;
            transition: background-color 0.3s ease; /* Hiệu ứng chuyển màu mượt mà */
        }
    </style>
</head>
<body>

    <div id="chart-container"></div>

    <script>
        Highcharts.chart('chart-container', {
            chart: {
                type: 'spline',

            },
            title: {
                text: 'Big Tech Capital Expenditure (CapEx)',
                style: { color: 'var(--text-title)', fontWeight: 'bold' } // Sử dụng biến CSS
            },
            subtitle: {
                text: '2018 - 2026 (Estimated in Billions USD)',
                style: { color: 'var(--text-subtitle)' }
            },
            xAxis: {  
                categories: ['2018', '2019', '2020', '2021', '2022', '2023', '2024', '2025', '2026'],  
                labels: {
                    style: { color: 'var(--text-axis)' } // Đổi màu nhãn trục X
                },
                crosshair: {  
                    color: 'var(--crosshair)', 
                    dashStyle: 'solid'  
                }  
            },
            yAxis: {
                title: {
                    text: 'Capital Expenditure (Billion USD)',
                    style: { color: 'var(--text-subtitle)' }
                },
                labels: {
                    format: '${value}B', 
                    style: { color: 'var(--text-axis)' }
                },
                gridLineColor: 'var(--grid-line)' // Màu đường lưới tự động đổi

                itemStyle: { color: 'var(--text-axis)' }, // Đổi màu tên cty ở chú thích

            },

                shared: true,
