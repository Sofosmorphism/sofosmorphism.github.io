<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Big Tech CapEx Plan (2018-2026)</title>
    
    <script src="https://code.highcharts.com/highcharts.js"></script>
    <script src="https://code.highcharts.com/modules/exporting.js"></script>
    <script src="https://code.highcharts.com/modules/export-data.js"></script>
    <script src="https://code.highcharts.com/modules/accessibility.js"></script>

    <style>
        body { 
            margin: 0; 
            padding: 20px; 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            background-color: #f0f2f5; /* Nền Sáng mặc định */
            transition: background-color 0.3s ease;
        }

        #chart-container {
            width: 100%;
            height: 600px;
            background-color: #ffffff; /* Nền Card Sáng */
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            padding: 10px;
            box-sizing: border-box;
            transition: background-color 0.3s ease, box-shadow 0.3s ease;
        }

        /* Tự động đổi nền Web khi ở chế độ Dark Mode */
        @media (prefers-color-scheme: dark) {
            body {
                background-color: #121212;
            }
            #chart-container {
                background-color: #1e1e1e;
                box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            }
        }
    </style>
</head>
<body>

    <div id="chart-container"></div>

    <script>
        // 1. CẢM BIẾN DARK MODE BẰNG JAVASCRIPT
        // Kiểm tra xem trình duyệt / HĐH của người dùng có đang bật Dark Mode không
        const isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;

        // 2. TẠO BẢNG MÀU CHUẨN XÁC DỰA TRÊN CHẾ ĐỘ
        const theme = {
            title: isDark ? '#4ade80' : '#00441b',
            subtitle: isDark ? '#86efac' : '#238b45',
            axisText: isDark ? '#e5e7eb' : '#333333',
            gridLine: isDark ? '#374151' : '#e5f5e0',
            crosshair: isDark ? 'rgba(255, 255, 255, 0.1)' : 'rgba(0, 0, 0, 0.05)',
            tooltipBg: isDark ? 'rgba(30, 30, 30, 0.95)' : 'rgba(255, 255, 255, 0.95)',
            tooltipText: isDark ? '#f3f4f6' : '#333333',
            tooltipBorder: isDark ? '#4ade80' : '#41ab5d',
            hrLine: isDark ? '#555555' : '#cccccc'
        };

        // 3. KHỞI TẠO BIỂU ĐỒ (Truyền trực tiếp biến theme vào cấu hình)
        Highcharts.chart('chart-container', {
            chart: {
                type: 'spline', 
                backgroundColor: 'transparent' // Giữ trong suốt để nhận màu nền từ CSS
            },
            title: {
                text: 'Big Tech Capital Expenditure (CapEx)',
                style: { color: theme.title, fontWeight: 'bold' } 
            },
            subtitle: {
                text: '2018 - 2026 (Estimated in Billions USD)',
                style: { color: theme.subtitle }
            },
            xAxis: {  
                categories: ['2018', '2019', '2020', '2021', '2022', '2023', '2024', '2025', '2026'],  
                labels: {
                    style: { color: theme.axisText } 
                },
                crosshair: {  
                    color: theme.crosshair, 
                    dashStyle: 'solid'  
                }  
            },
            yAxis: {
                title: {
                    text: 'Capital Expenditure (Billion USD)',
                    style: { color: theme.subtitle }
                },
                labels: {
                    format: '${value}B', 
                    style: { color: theme.axisText }
                },
                gridLineColor: theme.gridLine 
            },
            legend: {
                itemStyle: { color: theme.axisText }, 
                itemHoverStyle: { color: theme.title }
            },
            tooltip: {
                shared: true, 
                useHTML: true,
                backgroundColor: theme.tooltipBg, 
                borderColor: theme.tooltipBorder,
                style: { color: theme.tooltipText },
                // Cộng chuỗi để đưa mã màu vào thẻ HTML nội bộ
                headerFormat: '<span style="font-size: 14px; font-weight: bold; color: ' + theme.tooltipText + ';">Year {point.key}</span><br/><hr style="border: 0; border-top: 1px solid ' + theme.hrLine + '; margin: 5px 0;">',
                pointFormat: '<span style="color:{series.color}">\u25CF</span> {series.name}: <b>${point.y}B</b><br/>',
                borderRadius: 8,
