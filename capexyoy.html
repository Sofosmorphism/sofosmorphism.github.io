<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Big Tech CapEx Plan (2018-2026)</title>
    
    <script src="https://code.highcharts.com/highcharts.js"></script>
    <script src="https://code.highcharts.com/modules/exporting.js"></script>
    <script src="https://code.highcharts.com/modules/export-data.js"></script>
    <script src="https://code.highcharts.com/modules/accessibility.js"></script>

    <style>
        body { 
            margin: 0; 
            padding: 20px; 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            background-color: #f0f2f5; 
        }

        #chart-container {
            width: 100%;
            height: 600px;
            background-color: #ffffff; 
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            padding: 10px;
            box-sizing: border-box;
        }

        /* Đảo màu nền tổng thể khi ở chế độ Dark Mode */
        @media (prefers-color-scheme: dark) {
            body { background-color: #121212; }
            #chart-container { background-color: #1e1e1e; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        }
    </style>
</head>
<body>

    <div id="chart-container"></div>

    <script>
        // 1. Cảm biến Dark Mode an toàn
        var isDark = false;
        try {
            if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                isDark = true;
            }
        } catch (error) {
            console.log("Môi trường không hỗ trợ đọc Dark Mode");
        }

        // 2. Bảng màu tự động 
        var textColor = isDark ? '#e5e7eb' : '#333333';
        var titleColor = isDark ? '#4ade80' : '#00441b';
        var subTitleColor = isDark ? '#86efac' : '#238b45';
        var gridColor = isDark ? '#374151' : '#e5f5e0';
        var crosshairColor = isDark ? 'rgba(255, 255, 255, 0.1)' : 'rgba(0, 0, 0, 0.05)';
        var tooltipBgColor = isDark ? 'rgba(30, 30, 30, 0.95)' : 'rgba(255, 255, 255, 0.95)';
        var hrColor = isDark ? '#555555' : '#cccccc';

        // 3. Khởi tạo biểu đồ
        Highcharts.chart('chart-container', {
            chart: {
                type: 'spline', 
                backgroundColor: 'transparent'
            },
            title: {
                text: 'Big Tech Capital Expenditure (CapEx)',
                style: { color: titleColor, fontWeight: 'bold' } 
            },
            subtitle: {
                text: '2018 - 2026 (Estimated in Billions USD)',
                style: { color: subTitleColor }
            },
            xAxis: {  
                categories: ['2018', '2019', '2020', '2021', '2022', '2023', '2024', '2025', '2026'],  
                labels: { style: { color: textColor } },
                crosshair: { color: crosshairColor, dashStyle: 'solid' }  
            },
            yAxis: {
                title: { text: 'Capital Expenditure (Billion USD)', style: { color: textColor } },
                labels: { format: '${value}B', style: { color: textColor } },
                gridLineColor: gridColor 
            },
            legend: {
                itemStyle: { color: textColor }, 
                itemHoverStyle: { color: titleColor }
            },
            
            // ==========================================
            // QUAY LẠI CẤU TRÚC TOOLTIP BẢN GỐC CỦA BẠN
            // ==========================================
            tooltip: {
                shared: true, 
                useHTML: true,
                backgroundColor: tooltipBgColor, 
                borderColor: titleColor,
                borderRadius: 8,
                shadow: true,
                style: {
                    color: textColor
                },
                // Thay chữ #DDDDDD và #333 bằng biến màu tự động tương phản
                headerFormat: '<span style="font-size: 14px; font-weight: bold; color: ' + textColor + ';">Year {point.key}</span><br/><hr style="border: 0; border-top: 1px solid ' + hrColor + '; margin: 5px 0;">',
                pointFormat: '<span style="color:{series.color}">\u25CF</span> {series.name}: <b>${point.y}B</b><br/>'
            },
            // ==========================================

            plotOptions: {
                spline: {
                    lineWidth: 3,
                    marker: { radius: 4, symbol: 'circle' }
                }
            },
            series: [
                { name: 'Amazon', data: [13, 17, 40, 61, 64, 53, 83, 132, 200], color: '#FFAA4A' },
                { name: 'Google', data: [25, 24, 22, 25, 31, 32, 53, 91, 190], color: '#41ab5d' },
                { name: 'Microsoft', data: [14, 14, 18, 23, 25, 35, 56, 83, 190], color: '#820DFF' },
                { name: 'Meta', data: [14, 15, 15, 19, 31, 27, 37, 70, 135], color: '#3589EA' }
            ]
        });
    </script>
</body>
</html>
